<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested .then()</title>
    <script>
        const productDetails = [
        {proID: 1001 , proName: "iMac" , proPrice: 899},
        {proID: 1002 , proName: "Macbook" , proPrice: 1199},
        {proID: 1003 , proName: "iPad" , proPrice: 699},
        {proID: 1004 , proName: "Earpods" , proPrice: 599},
        {proID: 1005 , proName: "Charger" , proPrice: 199},
    ];

    function findProduct(productId, nextTask){
            console.log("Fetching Product Details, ID :"+productId);
            
            let promise = new Promise((resolve, rejected) => {
                let product;
                setTimeout(() => {
                product = productDetails.find((product) => product.proID === productId);
                if(product){
                    resolve(product);
                    if(nextTask) nextTask();
                }    
                else
                    rejected("Product not found");
            }, 3000);
            })
            return promise;
    }
    </script>
</head>
<body>

    <script>
        findProduct(1001).then((product) => {
            console.log(product);    //task 1 done
            findProduct(1002).then((product) => {
                console.log(product);       //task 2 done
                findProduct(1003).then((product) => {
                    console.log(product);     //task 3 done
                })
                .catch((error) => {
                    console.log(error);
                })
            })
            .catch((error) => {
                console.log(error);
            })
        })
        .catch((error) => {
            console.log(error);    
        });
    </script>

</body>
</html>
