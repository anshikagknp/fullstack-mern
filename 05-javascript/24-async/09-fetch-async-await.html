<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async/Await Fetch API</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <script>
        
    </script>
</head>
<body>
    <div id = "tableDiv" class = "container">
        <span id="mySpinner" class="spinner-border" style="display: none;"></span>
    </div>
    <script>
        // "https://randomuser.me/api/?results=10"
        
        async function fetchUsers(){
            let spinner = document.getElementById("mySpinner");
            spinner.style.display = "block";  //to show spinner

            let res = await fetch("https://randomuser.me/api/?results=10");
            let data = await res.json();
            createTable(data.results);

            spinner.style.display = "none";  //to hide spinner
        }
        fetchUsers();

        function createTable(users)
        {
            let d = document.getElementById("tableDiv");
            let table = document.createElement("table");

            let classList = table.classList;
            classList.add("table");
            classList.add("table-bordered");
            classList.add("table-striped")

            let thead = table.createTHead();
            let tbody = table.createTBody();
            let hrow = thead.insertRow();

            let hcol1 = hrow.insertCell();
            hcol1.textContent = "UserName";

            let hcol2 = hrow.insertCell();
            hcol2.textContent = "Email";

            let hcol3 = hrow.insertCell();
            hcol3.textContent = "Gender";

            let hcol4 = hrow.insertCell();
            hcol4.textContent = "Profile Picture";

            users.forEach((user) => {
                let row = tbody.insertRow();

                let col1 = row.insertCell();
                col1.textContent = user.name.first + " " + user.name.last;

                let col2 = row.insertCell();
                col2.textContent = user.email;

                let col3 = row.insertCell();
                col3.textContent = user.gender;

                let col4 = row.insertCell();
                let img = document.createElement("img");
                img.setAttribute("height" , "60px")
                img.setAttribute("width" , "50px")
                img.setAttribute("src", user.picture.thumbnail);
                col4.append(img);
            })
            d.append(table);
        }

    </script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
</body>
</html>
