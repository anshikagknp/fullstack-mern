<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center"> DOM Demo Page 3</h1>
    <input type="password" name="pwd" id="pwd" placeholder="Enter password">
    <input type = "checkbox" id="chk" onclick="myfun()" />
    <label id="label1" for="chk">Show Password</label>
    
    <script>
        function myfun()
        {
            let inpEle = document.getElementById("pwd")
            inpEle.type = (inpEle.type === "password")? 'text':'password'
            let labelEle = document.getElementById("label1")
            labelEle.textContent = (inpEle.type === "password")? 'Show password':'Hide Password'
        }
    </script>
</body>
</html>
