<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center"> DOM Demo Page </h1>

    <button onclick="myfun()">Create Table</button>

    </div>

    <script>
        const productDetails = [
            {proID: 1012 , proQty: 5, proName: "iMac" ,  proPrice: 899},
            {proID: 1112 , proQty: 2, proName: "Macbook" , proPrice: 1199},
            {proID: 3012 , proQty: 10, proName: "iPad" ,  proPrice: 699},
            {proID: 2012 , proQty: 25, proName: "Earpods" , proPrice: 599},
            {proID: 1412 , proQty: 50, proName: "Charger" , proPrice: 199},
        ];
        function myfun()
        {
            let table = document.createElement("table");
            let thead = table.createTHead();
            let hrow = thead.insertRow();
            for(let key in productDetails[0])
            {
                let hcol = hrow.insertCell();
                hcol.textContent = key;
                hcol.style.fontSize = "20px";
                hcol.style.textAlign = "center";
                hcol.style.fontWeight = "bold";
            }


            console.log(table);
            table.setAttribute("border", "5px")
            table.setAttribute("align", "center")
            table.setAttribute("width", "500px")

            productDetails.forEach((product)=>{
                let row = table.insertRow();
                for(let key in product){
                    let col = row.insertCell()
                    col.textContent = product[key]
                }
            });
            document.body.append(table);
        }
    </script>
</body>
</html>
