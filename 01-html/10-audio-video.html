<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio and Video</title>
</head>
<body>
    <!-- Video element with controls, looping, and a poster image -->
    <!-- controls attribute adds play, pause, and volume controls -->
    <!-- loop attribute makes the video loop continuously -->
    <!-- poster attribute specifies an image to display before the video plays like thumbnail -->
    <video width="300px" controls loop poster="../Images/doraemon.jpeg">
        <source src="../multimedia/video1.mp4" />
    </video>

    <!-- Audio element with controls -->
    <audio controls>
        <source src="../multimedia/audio1.mp3" />
    </audio>

</body>
</html>
