<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fieldset</title>
</head>
<body>
    <!-- Horizontal line -->
    <hr color="orange" size="20" width="300px">
    <h1 align="center">Demo Fieldset</h1>
    <hr color="orange" size="20" width="50%">

    <!-- Fieldset creates a bordered section -->
    <fieldset>

        <!-- Legend gives a title to the fieldset -->
        <legend align="center">Hey You</legend>

        Lorem ipsum dolor sit amet consectetur adipisicing elit.
        Eos quibusdam ducimus tempore officiis harum voluptatum.
        Eaque deleniti provident sint ipsum eius eligendi nam
        dolorum eos hic natus, voluptatum vitae? Maiores.

    </fieldset>

    <br>
</body>
</html>
