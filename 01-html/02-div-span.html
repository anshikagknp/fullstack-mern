<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div and Span</title>
    <style>
    div
    {
        border: 2px solid rgb(214, 10, 133);
    }

    span
    {
        border: 2px solid rgb(214, 10, 133);
    }
    </style>
</head>
<body>

    <!-- Horizontal line -->
    <hr color="orange" size="20" width="300px">
    <h1 align="center">Demo Page</h1>
    <hr color="orange" size="20" width="50%">

    <!-- Div is a block-level element that starts on a new line and takes up the full width available, groups related content together -->
    <div>Hello World</div>
    <div>Hello World</div>
    <div>Hello World</div>
    <div>Hello World</div>
    <div>Hello World</div>

    <br>

    <!-- Span is used to style inline text that stays on the same line and only takes up as much width as its content needs -->
    <span>Demo Text</span>
    <span>Demo Text</span>
    <span>Demo Text</span>
    <span>Demo Text</span>
    <span>Demo Text</span>

    <br>

</body>
</html>
