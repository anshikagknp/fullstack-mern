<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <!-- Table displays data in rows and columns -->
    <table
    border="1"
    width="60%"
    align="center"
    bgcolor="#f0f0f0"
    cellpadding="8"
    cellspacing="0">

        <!-- Table heading -->
        <thead>
            <tr>
                <th>Emp ID</th>
                <th>Emp Name</th>
                <th>Email</th>
                <th>Age</th>
                <th>Department</th>
            </tr>
        </thead>

        <!-- Table data -->
        <tbody>
            <tr>
                <td>101</td>
                <td>Anshika</td>
                <td>anshika@example.com</td>
                <td>21</td>
                <td>IT</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Rahul</td>
                <td>rahul@example.com</td>
                <td>22</td>
                <td>HR</td>
            </tr>
            <tr>
                <td>103</td>
                <td>Sachin</td>
                <td>sachin@gmail.com</td>
                <td>45</td>
                <td>Accounts</td>
            </tr>
            <tr>
                <td>104</td>
                <td>Deepa</td>
                <td>deepa@example.com</td>
                <td>28</td>
                <td>Marketing</td>
            </tr>
            <tr>
                <td>105</td>
                <td>Arjun</td>
                <td>arjun@example.com</td>
                <td>30</td>
                <td>IT</td>
            </tr>
        </tbody>

        <!-- Table footer -->
        <tfoot>
            <tr>
                <td colspan="5" align="center">
                    Total Employees: 5
                </td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
