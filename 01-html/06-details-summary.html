<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details and Summary</title>
    <!-- style tag for internal CSS -->
    <style>
        details
        {
            background-color: mediumaquamarine;
            text-decoration-color: rgb(19, 0, 128);
            border: 1px;
            padding: 20px;
            cursor:pointer;
            text-align:justify;
        }
    </style>
</head>
<body>
    <!-- The <details> element is used to create a disclosure widget that can be toggled open or closed by the user. -->
    <!-- The <summary> element is used to provide a summary or caption for the <details> element. -->
    <details>
        <summary>Click to know me!</summary>
        <p>
            Hi, I'm Anshika Gupta. Currently in the second year of MCA. Juggling academics, life and projects together. I'm a creative person who likes to think, read, learn and build. Connect with me to talk.
        </p>
    </details>
</body>
</html>
